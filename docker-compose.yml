services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bndes-naval-postgres
    environment:
      POSTGRES_DB: bndes_naval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bndes_naval"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
